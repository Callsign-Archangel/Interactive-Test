<!DOCTYPE html>
<html lang="en">
<head>

<style>
    :root {

        --border: #e2e8f0;

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

        color: var(--text-main);

    header {
        background-color: var(--primary);
        color: #ffffff;
        padding: 24px 20px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .header-container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;

    }
    
    .title-area h1 {
        font-size: 1.4rem;
        font-weight: 700;

    }
    
    .title-area p {
        font-size: 0.85rem;

    .stats-badge {

        flex-wrap: wrap;
        background-color: #1e293b;
        border: 2px solid #334155;
        border-radius: 8px;

    }

    .stat-item {
        padding: 6px 14px;
        border-radius: 6px;
        text-align: center;
        min-width: 70px;
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
        background-color: rgba(255, 255, 255, 0.05);
        user-select: none;
    }

    .stat-item:hover {
        transform: scale(1.05);
    }

    .stat-item .stat-num {
        font-size: 1.2rem;
        font-weight: 800;
        display: block;
        line-height: 1.2;
    }

    .stat-item .stat-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        opacity: 0.8;
    }

    .stat-item.correct-stat {
        background-color: rgba(16, 185, 129, 0.2);
        border-color: #10b981;
        color: #34d399;
    }

    .stat-item.correct-stat.active-filter {
        background-color: rgba(16, 185, 129, 0.4);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .stat-item.wrong-stat {
        background-color: rgba(239, 68, 68, 0.2);
        border-color: #ef4444;
        color: #f87171;
    }

    .stat-item.wrong-stat.active-filter {
        background-color: rgba(239, 68, 68, 0.4);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }

    .stat-item.left-stat {
        background-color: rgba(234, 179, 8, 0.2);
        border-color: #eab308;
        color: #fbbf24;
    }

    .stat-item.left-stat.active-filter {
        background-color: rgba(234, 179, 8, 0.4);
        box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }

    .stat-item.pct-stat {
        background-color: rgba(56, 189, 248, 0.15);
        border-color: #38bdf8;
        color: #38bdf8;
        min-width: 80px;
        cursor: default;
    }

    .stat-item.pct-stat:hover {
        transform: none;
    }

    .stat-item .stat-pct {
        font-size: 1.2rem;
        font-weight: 800;
        display: block;
        line-height: 1.2;
    }

        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
    }

        display: flex;
        flex-direction: column;
        gap: 12px;

        border-radius: 12px;
        border: 1px solid var(--border);

    .search-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    .search-input {
        flex: 1;
        min-width: 260px;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;

    .action-btn.primary {

    }

    .action-btn.primary:hover {

    }

    .action-btn.show-all-active {

    .filter-bar {

    .filter-btn {

    .question-card {

    }

    .qid-badge {

        color: #854d0e;
        border: 1px solid #fde047;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 3px 10px;
        border-radius: 20px;

        color: var(--text-muted);

        font-size: 0.7rem;

    }

        font-weight: 600;
        margin-bottom: 16px;
        color: var(--text-main);
    }
    
    .options-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 10px;
    }
    
    .opt-btn {
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px 16px;
        text-align: left;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    
    .opt-btn:hover:not(.disabled) {
        background-color: #f1f5f9;
        border-color: #94a3b8;
    }
    
    .opt-btn.correct {
        background-color: #ecfdf5 !important;
        border-color: #10b981 !important;
        color: #065f46 !important;
        font-weight: 700;
    }
    
    .opt-btn.wrong {
        background-color: #fef2f2 !important;
        border-color: #ef4444 !important;
        color: #991b1b !important;
    }
    
    .opt-btn.disabled {

    }
    
    .feedback-box {
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.9rem;

    }
    
    .feedback-box.show-correct {

        background-color: #f0fdf4;
        border-left: 4px solid var(--accent-green);

    }
    
    .feedback-box.show-wrong {
        display: block;
        background-color: #fff7ed;
        border-left: 4px solid #f97316;
        color: #9a3412;
    }
    
    .feedback-title {
        font-weight: 700;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .saved-note-banner {
        background-color: #fef9c3;
        border: 1px solid #fde047;
        color: #713f12;
        padding: 10px 14px;
        border-radius: 6px;
        margin-top: 10px;
        font-size: 0.85rem;
    }

    .notes-section {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed #cbd5e1;
    }

    .notes-btn {
        background-color: #0f172a;
        color: #ffffff;
        border: 1px solid #334155;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .notes-btn:hover {
        background-color: #334155;
    }

    .note-editor {
        margin-top: 10px;
        display: none;
    }

    .notes-area {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-family: inherit;
        font-size: 0.85rem;
        resize: vertical;
        margin-bottom: 8px;
        color: #1e293b;
    }

    .save-note-btn {
        background-color: #10b981;
        color: #ffffff;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
    }

    .save-note-btn:hover {

    }

    .no-results {
        text-align: center;
        padding: 40px;
        background: var(--card-bg);
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-weight: 600;
    }
</style>

<body>

<header>
    <div class="header-container">
        <div class="title-area">
            <h1>AFCAT 2026 — REASONING & APTITUDE INTERACTIVE QUIZ</h1>
            <p>250 MCQs Extracted from "AFCAT REASONING ANSWER KEY"[cite: 4] — Complete Patterns & Detailed Solutions</p>
        </div>
        <div class="stats-badge">
            <div class="stat-item correct-stat" id="correctStat" onclick="filterByStatus('correct')">
                <span class="stat-num" id="correct-count">0</span>
                <span class="stat-label">✅ Correct</span>
            </div>
            <div class="stat-item wrong-stat" id="wrongStat" onclick="filterByStatus('wrong')">
                <span class="stat-num" id="wrong-count">0</span>
                <span class="stat-label">❌ Wrong</span>
            </div>
            <div class="stat-item left-stat" id="leftStat" onclick="filterByStatus('left')">
                <span class="stat-num" id="left-count">250</span>
                <span class="stat-label">⏳ Left</span>
            </div>
            <div class="stat-item pct-stat">
                <span class="stat-pct" id="pct-display">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="controls-panel">
        <div class="search-row">
            <div style="flex:1; min-width:260px;">
                <input type="text" id="search-input" class="search-input" placeholder="Search by keyword, logic, module, or QID" oninput="applyFilters()">
                <div class="search-hint">💡 Tip: Enter a number like "42" to search by QID</div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
            <button class="action-btn primary" id="showAllBtn" onclick="toggleShowAll()">👁️ Show All Answers (Study Mode)</button>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterQuestions('All')">All 250 MCQs</button>
            <button class="filter-btn" data-filter="Module 1" onclick="filterQuestions('Module 1')">Mod 1: Coding-Decoding</button>
            <button class="filter-btn" data-filter="Module 2" onclick="filterQuestions('Module 2')">Mod 2: Number Puzzles</button>
            <button class="filter-btn" data-filter="Module 3" onclick="filterQuestions('Module 3')">Mod 3: Analogy & Jumbled</button>
            <button class="filter-btn" data-filter="Module 4" onclick="filterQuestions('Module 4')">Mod 4: Blood Relation</button>
            <button class="filter-btn" data-filter="Module 5" onclick="filterQuestions('Module 5')">Mod 5: Direction & Ranking</button>
            <button class="filter-btn" data-filter="Module 6" onclick="filterQuestions('Module 6')">Mod 6: Clock & Calendar</button>
            <button class="filter-btn" data-filter="Module 7" onclick="filterQuestions('Module 7')">Mod 7: Syllogism & Math Ops</button>
            <button class="filter-btn" data-filter="Module 8" onclick="filterQuestions('Module 8')">Mod 8: Venn & Data Sufficiency</button>
            <button class="filter-btn" data-filter="Module 9" onclick="filterQuestions('Module 9')">Mod 9: Seating Arrangement</button>
            <button class="filter-btn" data-filter="Module 10" onclick="filterQuestions('Module 10')">Mod 10: Non-Verbal Figures</button>
        </div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // Complete 250-MCQ dataset covering all topics extracted from the PDF[cite: 4]
    const originalQuestionsData = [
        // MODULE 1: CODING-DECODING & ALPHABETICAL SERIES (1-25)
        {"num": 1, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, SILENT is related to ROCMGT in a certain way based on alphabetical order. In the same way, FRIDGE is related to CHBJPG. To which of the following is SHADOW related?", "options": ["A) UPBBFT", "B) BFTUPB", "C) VEFTVQ", "D) FTBBUP"], "ans": 0, "brief": "Letters are shifted in a cross/reverse pattern with +1, -2, +1, -2, +1, -2 shifts, giving UPBBFT[cite: 4]."},
        {"num": 2, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, MOTHER is written as PFFUMN and LADAKH is written as FLYEYM. How is ORANGE written in that code language?", "options": ["A) CHLBPP", "B) PPBLAN", "C) HLCERW", "D) HLCEHU"], "ans": 0, "brief": "Pattern: Reverse cross pairing with +1, -2, +1, -2, +1, -2 letter shifts[cite: 4]."},
        {"num": 3, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, NUMBER is written as THDPWQ and BARREN is written as PHTUCE. How is RUBBER written in that code language?", "options": ["A) THDEWU", "B) THEDWU", "C) HTDEUW", "D) HTEDUW"], "ans": 0, "brief": "Diagonally shifting letters with +3, +2, +3, +2, +3, +2 increments[cite: 4]."},
        {"num": 4, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, DANGER is written as 14141857 and RANCOR is written as 1411818153. How is SUMMIT written in that code language?", "options": ["A) 13211920913", "B) 1321194568", "C) 13211913920", "D) 13547861111"], "ans": 0, "brief": "Words are split into two halves and place values of letters are crossed diagonally[cite: 4]."},
        {"num": 5, "module": "Module 1: Coding-Decoding", "q": "In a certain code PAUSE is written as OBVTD and SHIFT is written as RIJGS. How will THINK be written in the same code?", "options": ["A) SIJOJ", "B) UGHML", "C) SIJMJ", "D) SIJQL"], "ans": 0, "brief": "Letter shift pattern: first three letters -1, +1, +1; last two letters -1, -1[cite: 4]."},
        {"num": 6, "module": "Module 1: Coding-Decoding", "q": "If GLARES is coded as 2615208229 and MONSON as 13121413128, then how can RANSOM be coded?", "options": ["A) 1326914128", "B) 1356247821", "C) 2613247862", "D) 2613914128"], "ans": 0, "brief": "Words are split in half and opposite alphabetical place values are crossed diagonally[cite: 4]."},
        {"num": 7, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, 'golden silver bronze copper' is coded as i3 v2 i19 m7 and 'platina diamond emerald sapphire' is coded as z16 w4 w5 v19. What will be the code for 'crystal ruby'?", "options": ["A) 03 b18", "B) 03 i14", "C) c7 r4", "D) x7 j16"], "ans": 0, "brief": "Number = position of first letter; Letter = opposite of last letter of each word (L -> O, Y -> B)[cite: 4]."},
        {"num": 8, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, 'march april august october' is coded as 05 c5 c6 q7 and 'january february july december' is coded as 17 h8 14 f8. What will be the code for 'energetic may'?", "options": ["A) g9 03", "B) u7 03", "C) u9 p3", "D) g8 03"], "ans": 0, "brief": "Letter = first letter shifted +2 positions; Number = total number of letters in the word[cite: 4]."},
        {"num": 9, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, 'captain soldier border battles' is coded as x3 h3 y2 y2 and 'planet galaxy rocket satellite' is coded as k2 t2 i2 h4. What will be the code for 'teacher garden'?", "options": ["A) g3 t2", "B) w7 p1", "C) g2 t2", "D) v7 q3"], "ans": 0, "brief": "Letter = opposite of first letter; Number = count of vowels in the word[cite: 4]."},
        {"num": 10, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, 'bounce flight ground prison' is coded as h3 w5 g4 q4 and 'travel direct frozen stream' is coded as o4 w4 q4 p4. What will be the code for 'church standard'?", "options": ["A) k5 g6", "B) x6 h6", "C) k5 g8", "D) c6 h5"], "ans": 0, "brief": "Letter = last letter +3 positions; Number = count of consonants in the word[cite: 4]."},
        {"num": 11, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, 'mobile camera laptop tablet' is coded as f13 b3 q12 u20 and 'doctor patient teacher student' is coded as s4 u16 s20 u19. What will be the code for 'garden orange'?", "options": ["A) 07 f15", "B) 08 f15", "C) p7 g15", "D) 07 e15"], "ans": 0, "brief": "Letter = last letter shifted +1; Number = alphabetical position of the first letter[cite: 4]."},
        {"num": 12, "module": "Module 1: Coding-Decoding", "q": "In a code language, 'TIMBER' is coded as '2064141121' and 'JUNGLE' is coded as '7139152311'. Which word-code pair is correct: (I) STAR : 2220715, (II) NEST : 616413, (III) LAND : 2022220?", "options": ["A) III only (LAND : 2022220)", "B) I and II only", "C) II and III only", "D) II only"], "ans": 0, "brief": "Place values are crossed diagonally in pairs with specific arithmetic shifts[cite: 4]."},
        {"num": 13, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, BLAME is written as 5131122 and CRUST is written as 201921183. Which of the following matches is correct: I. FLINT -> 251141516, II. SHARK -> 20149126, III. POND -> 11181819?", "options": ["A) I-B, II-C (SHARK -> 11181819 context)", "B) I-A, II-C, III-B", "C) II-A, III-C", "D) I-C, II-B, III-A"], "ans": 0, "brief": "Diagonally writing the alphabetical place values of each letter[cite: 4]."},
        {"num": 14, "module": "Module 1: Coding-Decoding", "q": "In a certain code language, ZEBRA is written as 52104362 and JOKER is written as 2030221036. Which match is correct: I. TIGER -> 382822210, II. SNAKE -> 4018141036, III. LEOPARD -> 41816121514?", "options": ["A) I-B, II-A (SNAKE -> 382822210, TIGER -> 4018141036)", "B) I-A, II-B, III-C", "C) I-C, III-A", "D) I-A, II-C, III-B"], "ans": 0, "brief": "Alphabetical place value of each letter multiplied by 2[cite: 4]."},

    let activeQuestions = [];
    let currentScore = 0;
    let wrongCount = 0;
    let answeredCount = 0;
    let activeFilter = 'All';
    let searchQuery = '';
    let showAllActive = false;
    let statusFilter = 'all';
    let questionStatus = {};

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initializeAndShuffleQuiz() {
        const prepared = originalQuestionsData.map(q => {
            const cleanOptions = q.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
            const correctAnswerText = cleanOptions[q.ans];
            const shuffledCleanOptions = shuffleArray(cleanOptions);
            const newCorrectIdx = shuffledCleanOptions.indexOf(correctAnswerText);
            const relabeledOptions = shuffledCleanOptions.map((opt, i) => {
                return String.fromCharCode(65 + i) + ') ' + opt;
            });
            return {
                ...q,
                options: relabeledOptions,
                ans: newCorrectIdx
            };
        });
        activeQuestions = shuffleArray(prepared);
        questionStatus = {};
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
    }

    function applyFilters() {
        searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        renderQuiz();
    }

    function filterByStatus(status) {
        if (statusFilter === status) {
            statusFilter = 'all';
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        } else {
            statusFilter = status;
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
            if (status === 'correct') {
                document.getElementById('correctStat').classList.add('active-filter');
            } else if (status === 'wrong') {
                document.getElementById('wrongStat').classList.add('active-filter');
            } else if (status === 'left') {
                document.getElementById('leftStat').classList.add('active-filter');
            }
        }
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        let displayCount = 0;
        let seqNum = 1;

        const isQidSearch = searchQuery && /^\d+$/.test(searchQuery);
        const qidNumber = isQidSearch ? parseInt(searchQuery) : null;

        activeQuestions.forEach((q) => {
            if (activeFilter !== 'All') {
                const qModuleMatch = q.module.match(/Module (\d+)/);
                const qModuleNum = qModuleMatch ? qModuleMatch[1] : null;
                const filterMatch = activeFilter.match(/Module (\d+)/);
                const filterModuleNum = filterMatch ? filterMatch[1] : null;
                
                if (qModuleNum && filterModuleNum) {
                    if (qModuleNum !== filterModuleNum) return;
                } else {
                    if (!q.module.startsWith(activeFilter + ':')) return;
                }
            }
            
            if (statusFilter !== 'all') {
                const status = questionStatus[q.num];
                if (statusFilter === 'correct' && status !== 'correct') return;
                if (statusFilter === 'wrong' && status !== 'wrong') return;
                if (statusFilter === 'left' && status !== undefined) return;
            }
            
            if (searchQuery) {
                if (isQidSearch) {
                    if (q.num !== qidNumber) return;
                } else {
                    const match = q.q.toLowerCase().includes(searchQuery) ||
                                  q.module.toLowerCase().includes(searchQuery) ||
                                  q.brief.toLowerCase().includes(searchQuery) ||
                                  q.options.some(o => o.toLowerCase().includes(searchQuery));
                    if (!match) return;
                }
            }
            
            displayCount++;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.num}`;
            
            const savedNote = localStorage.getItem(`afcat_reasoning_note_QID_${q.num}`) || '';
            const savedNoteHtml = savedNote ? `
                <div class="saved-note-banner" id="saved-display-${q.num}">
                    <strong>📌 Saved Note:</strong> ${savedNote}
                </div>` : `<div id="saved-display-${q.num}"></div>`;
            
            const status = questionStatus[q.num];
            let statusBadge = '';
            if (status === 'correct') {
                statusBadge = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else if (status === 'wrong') {
                statusBadge = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            } else {
                statusBadge = `<span class="q-status-badge status-unanswered">⏳ Unanswered</span>`;
            }
            
            card.innerHTML = `
                <div class="q-header">
                    <div class="q-badges-left">
                        <span class="q-num-badge">Question #${seqNum++}</span>
                        <span class="qid-badge">QID:- ${q.num}</span>
                        ${statusBadge}
                    </div>
                    <span class="q-mod-badge">${q.module}</span>
                </div>
                <div class="q-text">${q.q}</div>
                <div class="options-grid" id="opts-${q.num}">
                    ${q.options.map((optText, optIdx) => `
                        <button class="opt-btn" onclick="checkAnswer(${q.num}, ${optIdx}, ${q.ans})">
                            <span>${optText}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback-${q.num}">
                    ${showAllActive && !questionStatus[q.num] ? `
                        <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                        <div><strong>Logic & Explanation:</strong> ${q.brief}</div>
                        ${savedNoteHtml}
                        <div class="notes-section">
                            <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                            <div class="note-editor" id="editor-${q.num}">
                                <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                                <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);

            if (questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                        if (q._selectedIdx !== undefined && idx === q._selectedIdx && idx !== q.ans) {
                            btn.classList.add('wrong');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    const isCorrect = questionStatus[q.num] === 'correct';
                    feedback.className = `feedback-box show-${isCorrect ? 'correct' : 'wrong'}`;
                    const savedNoteDisplay = localStorage.getItem(`afcat_reasoning_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (isCorrect) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer!</div>
                            <div><strong>Logic & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    } else {
                        feedback.innerHTML = `
                            <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${q.options[q.ans]}</div>
                            <div><strong>Logic & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            if (showAllActive && !questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    feedback.className = 'feedback-box show-correct';
                    const savedNoteDisplay = localStorage.getItem(`afcat_reasoning_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (!feedback.innerHTML) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                            <div><strong>Logic & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }
        });

        if (displayCount === 0) {
            let message = 'No AFCAT Reasoning MCQs matched your search.';
            if (isQidSearch) {
                message = `No question found with QID ${qidNumber}. Please check the QID and try again.`;
            } else if (statusFilter === 'correct' && currentScore === 0) {
                message = 'No correct answers yet. Keep practicing! 🎯';
            } else if (statusFilter === 'wrong' && wrongCount === 0) {
                message = 'No wrong answers yet! Great job! 🎉';
            } else if (statusFilter === 'left') {
                if (answeredCount === activeQuestions.length) {
                    message = '🎉 All questions have been answered! No questions left to attempt.';
                } else {
                    message = `📝 You have ${activeQuestions.length - answeredCount} questions left to attempt. Start answering!`;
                }
            }
            container.innerHTML = `<div class="no-results">${message}</div>`;
        }

        updateStats();
    }

    function checkAnswer(qNum, selectedIdx, correctIdx) {
        if (showAllActive) return;
        if (questionStatus[qNum]) return;
        
        const optsContainer = document.getElementById(`opts-${qNum}`);
        const buttons = optsContainer.querySelectorAll('.opt-btn');
        const feedback = document.getElementById(`feedback-${qNum}`);
        
        if (buttons[0].classList.contains('disabled')) {
            return;
        }
        
        const qObj = activeQuestions.find(item => item.num === qNum);
        qObj._selectedIdx = selectedIdx;
        
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === correctIdx) {
                btn.classList.add('correct');
            }
        });
        
        const savedNote = localStorage.getItem(`afcat_reasoning_note_QID_${qNum}`) || '';
        const savedNoteHtml = savedNote ? `
            <div class="saved-note-banner" id="saved-display-${qNum}">
                <strong>📌 Saved Note:</strong> ${savedNote}
            </div>` : `<div id="saved-display-${qNum}"></div>`;
        
        const isCorrect = selectedIdx === correctIdx;
        if (isCorrect) {
            currentScore++;
            questionStatus[qNum] = 'correct';
            buttons[selectedIdx].classList.add('correct');
            feedback.className = 'feedback-box show-correct';
            feedback.innerHTML = `
                <div class="feedback-title">✓ Correct Answer!</div>
                <div><strong>Logic & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        } else {
            wrongCount++;
            questionStatus[qNum] = 'wrong';
            buttons[selectedIdx].classList.add('wrong');
            const correctOptText = qObj.options[correctIdx];
            feedback.className = 'feedback-box show-wrong';
            feedback.innerHTML = `
                <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${correctOptText}</div>
                <div><strong>Logic & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        }
        answeredCount++;
        
        const badgeContainer = document.querySelector(`#card-${qNum} .q-badges-left`);
        if (badgeContainer) {
            const oldBadge = badgeContainer.querySelector('.q-status-badge');
            let newBadgeHtml = '';
            if (isCorrect) {
                newBadgeHtml = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else {
                newBadgeHtml = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            }
            if (oldBadge) {
                oldBadge.outerHTML = newBadgeHtml;
            } else {
                badgeContainer.innerHTML += newBadgeHtml;
            }
        }
        
        updateStats();
        
        if (statusFilter !== 'all') {
            renderQuiz();
        }
    }

    function toggleNoteEditor(qNum) {
        const editor = document.getElementById(`editor-${qNum}`);
        if (editor.style.display === 'block') {
            editor.style.display = 'none';
        } else {
            editor.style.display = 'block';
        }
    }

    function saveNote(qNum) {
        const textarea = document.getElementById(`textarea-${qNum}`);
        const noteText = textarea.value.trim();
        const storageKey = `afcat_reasoning_note_QID_${qNum}`;
        
        if (noteText) {
            localStorage.setItem(storageKey, noteText);
        } else {
            localStorage.removeItem(storageKey);
        }

        const displayContainer = document.getElementById(`saved-display-${qNum}`);
        if (noteText) {
            displayContainer.className = 'saved-note-banner';
            displayContainer.innerHTML = `<strong>📌 Saved Note:</strong> ${noteText}`;
        } else {
            displayContainer.className = '';
            displayContainer.innerHTML = '';
        }
        document.getElementById(`editor-${qNum}`).style.display = 'none';
    }

    function updateStats() {
        const totalQuestions = activeQuestions.length;
        const leftToAttempt = totalQuestions - answeredCount;
        
        document.getElementById('correct-count').textContent = currentScore;
        document.getElementById('wrong-count').textContent = wrongCount;
        document.getElementById('left-count').textContent = leftToAttempt;
        
        const pct = answeredCount > 0 ? Math.round((currentScore / answeredCount) * 100) : 0;
        document.getElementById('pct-display').textContent = pct + '%';
    }

    function filterQuestions(modPrefix) {
        activeFilter = modPrefix;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-filter') === modPrefix) {
                btn.classList.add('active');
            }
        });
        renderQuiz();
    }

    function resetQuiz() {
        if (showAllActive) {
            showAllActive = false;
            const btn = document.getElementById('showAllBtn');
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        questionStatus = {};
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
        renderQuiz();
    }

    function toggleShowAll() {
        const btn = document.getElementById('showAllBtn');
        showAllActive = !showAllActive;
        
        if (showAllActive) {
            btn.classList.add('show-all-active');
            btn.textContent = '🔴 Hide All Answers';
        } else {
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        renderQuiz();
    }

    // Initialize
    initializeAndShuffleQuiz();
    renderQuiz();
</script>
</body>
</html>
