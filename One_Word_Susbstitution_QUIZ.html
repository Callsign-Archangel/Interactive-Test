<body>

<header>
    <div class="header-container">
        <div class="title-area">
            <h1>AFCAT 2026 — ONE-WORD SUBSTITUTION INTERACTIVE QUIZ</h1>
            <p>250 MCQs Extracted from "One word substitution. (1).pdf"[cite: 6] — Root Words, Etymology & Tricks</p>
        </div>
        <div class="stats-badge">
            <div class="stat-item correct-stat" id="correctStat" onclick="filterByStatus('correct')">
                <span class="stat-num" id="correct-count">0</span>
                <span class="stat-label">✅ Correct</span>
            </div>
            <div class="stat-item wrong-stat" id="wrongStat" onclick="filterByStatus('wrong')">
                <span class="stat-num" id="wrong-count">0</span>
                <span class="stat-label">❌ Wrong</span>
            </div>
            <div class="stat-item left-stat" id="leftStat" onclick="filterByStatus('left')">
                <span class="stat-num" id="left-count">250</span>
                <span class="stat-label">⏳ Left</span>
            </div>
            <div class="stat-item pct-stat">
                <span class="stat-pct" id="pct-display">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="controls-panel">
        <div class="search-row">
            <div style="flex:1; min-width:260px;">
                <input type="text" id="search-input" class="search-input" placeholder="Search by word, root, meaning, or QID" oninput="applyFilters()">
                <div class="search-hint">💡 Tip: Enter a number like "42" to search by QID</div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
            <button class="action-btn primary" id="showAllBtn" onclick="toggleShowAll()">👁️ Show All Answers (Study Mode)</button>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterQuestions('All')">All 250 MCQs</button>
            <button class="filter-btn" data-filter="Module 1" onclick="filterQuestions('Module 1')">Mod 1: Governance & Rule</button>
            <button class="filter-btn" data-filter="Module 2" onclick="filterQuestions('Module 2')">Mod 2: Killings & Crime</button>
            <button class="filter-btn" data-filter="Module 3" onclick="filterQuestions('Module 3')">Mod 3: Phobias & Manias</button>
            <button class="filter-btn" data-filter="Module 4" onclick="filterQuestions('Module 4')">Mod 4: Speech & Language</button>
            <button class="filter-btn" data-filter="Module 5" onclick="filterQuestions('Module 5')">Mod 5: Sciences & Studies</button>
            <button class="filter-btn" data-filter="Module 6" onclick="filterQuestions('Module 6')">Mod 6: Literature & Poetry</button>
            <button class="filter-btn" data-filter="Module 7" onclick="filterQuestions('Module 7')">Mod 7: Personality & Character</button>
            <button class="filter-btn" data-filter="Module 8" onclick="filterQuestions('Module 8')">Mod 8: Religion & Belief</button>
            <button class="filter-btn" data-filter="Module 9" onclick="filterQuestions('Module 9')">Mod 9: Marriage & Family</button>
            <button class="filter-btn" data-filter="Module 10" onclick="filterQuestions('Module 10')">Mod 10: General Vocab & Roots</button>
        </div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // Complete 250-MCQ dataset covering all topics extracted from the PDF[cite: 6]
    const originalQuestionsData = [
        // MODULE 1: GOVERNANCE, POLITICAL SYSTEMS & RULE (1-25)
        {"num": 1, "module": "Module 1: Governance & Rule", "q": "Rule by the wealthy is called — [Q.41]", "options": ["A) Plutocracy", "B) Kratocracy", "C) Theocracy", "D) Anarchy"], "ans": 0, "brief": "Plutocracy is rule by the wealthy; Kratocracy is rule by strong/powerful people; Theocracy is rule by religious leaders; Anarchy is no rule/no government[cite: 6]."},
        {"num": 2, "module": "Module 1: Governance & Rule", "q": "A government by the people is called —", "options": ["A) Democracy", "B) Oligarchy", "C) Autocracy", "D) Plutocracy"], "ans": 0, "brief": "Democracy (Demo = people + cracy = rule) means government by the people[cite: 6]."},
        {"num": 3, "module": "Module 1: Governance & Rule", "q": "A government by a few people is called —", "options": ["A) Oligarchy", "B) Anarchy", "C) Plutocracy", "D) Democracy"], "ans": 0, "brief": "Oligarchy means rule or government by a small group of people[cite: 6]."},
        {"num": 4, "module": "Module 1: Governance & Rule", "q": "Absence of government or law and order in a state is —", "options": ["A) Anarchy", "B) Oligarchy", "C) Plutocracy", "D) Gerontocracy"], "ans": 0, "brief": "Anarchy ('arājakatā') means absence of rule or government[cite: 6]."},
        {"num": 5, "module": "Module 1: Governance & Rule", "q": "Rule by elderly people is called —", "options": ["A) Gerontocracy", "B) Democracy", "C) Theocracy", "D) Autocracy"], "ans": 0, "brief": "Gerontocracy means rule by elderly people ('experience leads, youth follows')[cite: 6]."},
        {"num": 6, "module": "Module 1: Governance & Rule", "q": "Rule by religious leaders or priests is called —", "options": ["A) Theocracy", "B) Plutocracy", "C) Kratocracy", "D) Oligarchy"], "ans": 0, "brief": "Theocracy (Theo = religion/God + cracy = rule) means rule by religious leaders[cite: 6]."},
        {"num": 7, "module": "Module 1: Governance & Rule", "q": "Rule by strong and powerful people is called — [Q.41 Option]", "options": ["A) Kratocracy", "B) Plutocracy", "C) Theocracy", "D) Democracy"], "ans": 0, "brief": "Kratocracy denotes government by those who are strong enough to seize power through force[cite: 6]."},
        {"num": 8, "module": "Module 1: Governance & Rule", "q": "Having unlimited power is — [Q.54]", "options": ["A) Omnipotent", "B) Omnipresent", "C) Omniscient", "D) Omnibus"], "ans": 0, "brief": "Omnipotent (Omni = all + potent = power) means having unlimited power; Omnipresent = present everywhere; Omniscient = knowing everything[cite: 6]."},
        {"num": 9, "module": "Module 1: Governance & Rule", "q": "A period of discontinuity or 'gap' in a government or organization — [Q.70]", "options": ["A) Interregnum", "B) Chronicle", "C) Metamorphosis", "D) Aberration"], "ans": 0, "brief": "Interregnum means a period of discontinuity or gap in a government/organization (synonyms: hiatus, fissure, lacuna)[cite: 6]."},
        {"num": 10, "module": "Module 1: Governance & Rule", "q": "A supporter of complete state control and classless society is — [Q.66]", "options": ["A) Communist", "B) Socialist", "C) Capitalism", "D) Fascist"], "ans": 0, "brief": "A Communist supports complete state ownership of resources and a classless society; a Socialist supports social equity; Fascist supports autocratic dictatorship[cite: 6]."},
        {"num": 11, "module": "Module 1: Governance & Rule", "q": "Which term refers to a person who supports a dictatorship or autocratic rule? [Q.66 Option]", "options": ["A) Fascist", "B) Communist", "C) Socialist", "D) Democrat"], "ans": 0, "brief": "A Fascist is one who supports dictatorship or autocratic, right-wing authoritarian governance[cite: 6]."},
        {"num": 12, "module": "Module 1: Governance & Rule", "q": "An imaginary perfect place is — [Q.56]", "options": ["A) Utopia", "B) Dystopia", "C) Nirvana", "D) Babylon"], "ans": 0, "brief": "Utopia ('Rām Rājya') means an imaginary perfect world; Dystopia is an imaginary place of suffering; Nirvana is spiritual liberation[cite: 6]."},
        {"num": 13, "module": "Module 1: Governance & Rule", "q": "An imaginary place of suffering or injustice is called — [Q.56 Option]", "options": ["A) Dystopia", "B) Utopia", "C) Nirvana", "D) Babylon"], "ans": 0, "brief": "Dystopia is an imaginary wretched place of suffering and tyranny, the exact opposite of Utopia[cite: 6]."},
        {"num": 14, "module": "Module 1: Governance & Rule", "q": "An ancient city known for luxury and moral corruption is — [Q.56 Option]", "options": ["A) Babylon", "B) Utopia", "C) Dystopia", "D) Nirvana"], "ans": 0, "brief": "Babylon historically symbolizes a luxurious, morally corrupt ancient city[cite: 6]."},
        {"num": 15, "module": "Module 1: Governance & Rule", "q": "A general pardon granted by a government to a group of political offenders is —", "options": ["A) Amnesty", "B) Exculpate", "C) Vindicate", "D) Exoneration"], "ans": 0, "brief": "Amnesty means an official pardon granted by government authorities (synonyms: exoneration, immunity, acquit)[cite: 6]."},
        {"num": 16, "module": "Module 1: Governance & Rule", "q": "To give up a throne voluntarily is — [Q.90]", "options": ["A) Abdicate", "B) Acquiesce", "C) Placate", "D) Vindicate"], "ans": 0, "brief": "Abdicate means to renounce or give up a throne voluntarily (synonyms: abandon, renounce, relinquish)[cite: 6]."},
        {"num": 17, "module": "Module 1: Governance & Rule", "q": "The right to vote in political elections is called — [Q.86]", "options": ["A) Suffrage", "B) Verbatim", "C) Acquittal", "D) Accord"], "ans": 0, "brief": "Suffrage means the right to vote in political elections; Verbatim = word for word; Acquittal = exoneration; Accord = agreement[cite: 6]."},
        {"num": 18, "module": "Module 1: Governance & Rule", "q": "Protection or support provided by an authority is called — [Q.91]", "options": ["A) Aegis", "B) Credence", "C) Bonafide", "D) Malafide"], "ans": 0, "brief": "Aegis means protection, sponsorship, or support; Credence = belief/acceptance; Bonafide = genuine; Malafide = bad faith[cite: 6]."},
        {"num": 19, "module": "Module 1: Governance & Rule", "q": "A person who is blamed for the wrongdoings of others is — [Q.84]", "options": ["A) Scapegoat", "B) Pilferage", "C) Vandal", "D) Sabotage"], "ans": 0, "brief": "Scapegoat ('balī kā bakrā') is a person who is blamed for the wrongdoings of others[cite: 6]."},
        {"num": 20, "module": "Module 1: Governance & Rule", "q": "Deliberately destroying or damaging public or private property is — [Q.84 Option]", "options": ["A) Vandalism / Vandal", "B) Pilferage", "C) Scapegoat", "D) Sabotage"], "ans": 0, "brief": "A Vandal is someone who deliberately damages or destroys property[cite: 6]."},
        {"num": 21, "module": "Module 1: Governance & Rule", "q": "Deliberately destroying an organization's property or operations to weaken it is — [Q.84 Option]", "options": ["A) Sabotage", "B) Pilferage", "C) Vandal", "D) Scapegoat"], "ans": 0, "brief": "Sabotage means destroying an organization or equipment to weaken them[cite: 6]."},
        {"num": 22, "module": "Module 1: Governance & Rule", "q": "An official agreement or treaty between two nations is — [Q.86 Option]", "options": ["A) Accord", "B) Suffrage", "C) Verbatim", "D) Acquittal"], "ans": 0, "brief": "Accord means a formal agreement or harmony between parties/nations[cite: 6]."},
        {"num": 23, "module": "Module 1: Governance & Rule", "q": "To accept something reluctantly but without protest is — [Q.90 Option]", "options": ["A) Acquiesce", "B) Abdicate", "C) Placate", "D) Vindicate"], "ans": 0, "brief": "Acquiesce ('quiet') means to accept or comply silently without protest[cite: 6]."},

        {"num": 246, "module": "Module 10: General Vocab & Roots", "q": "A person who lives outside their native country is an —", "options": ["A) Expatriate", "B) Immigrant", "C) Emigrant", "D) Nomad"], "ans": 0, "brief": "Expatriate ('Ex-pat') is a person residing in a foreign country[cite: 6]."},
        {"num": 247, "module": "Module 10: General Vocab & Roots", "q": "A stupid, foolish, or incompetent person is a —", "options": ["A) Nincompoop / Dunce / Imbecile / Obtuse", "B) Astute", "C) Acumen", "D) Prodigy"], "ans": 0, "brief": "Nincompoop, Dunce, Imbecile, and Obtuse describe foolish incompetence[cite: 6]."},
        {"num": 248, "module": "Module 10: General Vocab & Roots", "q": "Evoking a keen sense of sadness, regret, or painful old memories is —", "options": ["A) Poignant / Reminiscence / Nostalgia", "B) Sanguine", "C) Hedonistic", "D) Alacrity"], "ans": 0, "brief": "Poignant, Reminiscence, and Nostalgia evoke tender, sorrowful memories[cite: 6]."},
        {"num": 249, "module": "Module 10: General Vocab & Roots", "q": "Brisk and cheerful readiness or eagerness is —", "options": ["A) Alacrity", "B) Ennui", "C) Lethargy", "D) Torpor"], "ans": 0, "brief": "Alacrity means quick, eager, and cheerful readiness[cite: 6]."},
        {"num": 250, "module": "Module 10: General Vocab & Roots", "q": "A storehouse where weapons and military ammunition are kept is an — [Q.98 Option]", "options": ["A) Arsenal", "B) Proletariat", "C) Prototype", "D) Aviary"], "ans": 0, "brief": "An Arsenal is an armory where weapons and ammunition are stored[cite: 6]."}
    ];

    let activeQuestions = [];
    let currentScore = 0;
    let wrongCount = 0;
    let answeredCount = 0;
    let activeFilter = 'All';
    let searchQuery = '';
    let showAllActive = false;
    let statusFilter = 'all';
    let questionStatus = {};

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initializeAndShuffleQuiz() {
        const prepared = originalQuestionsData.map(q => {
            const cleanOptions = q.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
            const correctAnswerText = cleanOptions[q.ans];
            const shuffledCleanOptions = shuffleArray(cleanOptions);
            const newCorrectIdx = shuffledCleanOptions.indexOf(correctAnswerText);
            const relabeledOptions = shuffledCleanOptions.map((opt, i) => {
                return String.fromCharCode(65 + i) + ') ' + opt;
            });
            return {
                ...q,
                options: relabeledOptions,
                ans: newCorrectIdx
            };
        });
        activeQuestions = shuffleArray(prepared);
        questionStatus = {};
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
    }

    function applyFilters() {
        searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        renderQuiz();
    }

    function filterByStatus(status) {
        if (statusFilter === status) {
            statusFilter = 'all';
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        } else {
            statusFilter = status;
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
            if (status === 'correct') {
                document.getElementById('correctStat').classList.add('active-filter');
            } else if (status === 'wrong') {
                document.getElementById('wrongStat').classList.add('active-filter');
            } else if (status === 'left') {
                document.getElementById('leftStat').classList.add('active-filter');
            }
        }
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        let displayCount = 0;
        let seqNum = 1;

        const isQidSearch = searchQuery && /^\d+$/.test(searchQuery);
        const qidNumber = isQidSearch ? parseInt(searchQuery) : null;

        activeQuestions.forEach((q) => {
            if (activeFilter !== 'All') {
                const qModuleMatch = q.module.match(/Module (\d+)/);
                const qModuleNum = qModuleMatch ? qModuleMatch[1] : null;
                const filterMatch = activeFilter.match(/Module (\d+)/);
                const filterModuleNum = filterMatch ? filterMatch[1] : null;
                
                if (qModuleNum && filterModuleNum) {
                    if (qModuleNum !== filterModuleNum) return;
                } else {
                    if (!q.module.startsWith(activeFilter + ':')) return;
                }
            }
            
            if (statusFilter !== 'all') {
                const status = questionStatus[q.num];
                if (statusFilter === 'correct' && status !== 'correct') return;
                if (statusFilter === 'wrong' && status !== 'wrong') return;
                if (statusFilter === 'left' && status !== undefined) return;
            }
            
            if (searchQuery) {
                if (isQidSearch) {
                    if (q.num !== qidNumber) return;
                } else {
                    const match = q.q.toLowerCase().includes(searchQuery) ||
                                  q.module.toLowerCase().includes(searchQuery) ||
                                  q.brief.toLowerCase().includes(searchQuery) ||
                                  q.options.some(o => o.toLowerCase().includes(searchQuery));
                    if (!match) return;
                }
            }
            
            displayCount++;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.num}`;
            
            const savedNote = localStorage.getItem(`oneword_sub_note_QID_${q.num}`) || '';
            const savedNoteHtml = savedNote ? `
                <div class="saved-note-banner" id="saved-display-${q.num}">
                    <strong>📌 Saved Note:</strong> ${savedNote}
                </div>` : `<div id="saved-display-${q.num}"></div>`;
            
            const status = questionStatus[q.num];
            let statusBadge = '';
            if (status === 'correct') {
                statusBadge = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else if (status === 'wrong') {
                statusBadge = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            } else {
                statusBadge = `<span class="q-status-badge status-unanswered">⏳ Unanswered</span>`;
            }
            
            card.innerHTML = `
                <div class="q-header">
                    <div class="q-badges-left">
                        <span class="q-num-badge">Question #${seqNum++}</span>
                        <span class="qid-badge">QID:- ${q.num}</span>
                        ${statusBadge}
                    </div>
                    <span class="q-mod-badge">${q.module}</span>
                </div>
                <div class="q-text">${q.q}</div>
                <div class="options-grid" id="opts-${q.num}">
                    ${q.options.map((optText, optIdx) => `
                        <button class="opt-btn" onclick="checkAnswer(${q.num}, ${optIdx}, ${q.ans})">
                            <span>${optText}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback-${q.num}">
                    ${showAllActive && !questionStatus[q.num] ? `
                        <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                        <div><strong>Root Word / Etymology Trick:</strong> ${q.brief}</div>
                        ${savedNoteHtml}
                        <div class="notes-section">
                            <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                            <div class="note-editor" id="editor-${q.num}">
                                <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                                <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);

            if (questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                        if (q._selectedIdx !== undefined && idx === q._selectedIdx && idx !== q.ans) {
                            btn.classList.add('wrong');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    const isCorrect = questionStatus[q.num] === 'correct';
                    feedback.className = `feedback-box show-${isCorrect ? 'correct' : 'wrong'}`;
                    const savedNoteDisplay = localStorage.getItem(`oneword_sub_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (isCorrect) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer!</div>
                            <div><strong>Root Word / Etymology Trick:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    } else {
                        feedback.innerHTML = `
                            <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${q.options[q.ans]}</div>
                            <div><strong>Root Word / Etymology Trick:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            if (showAllActive && !questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    feedback.className = 'feedback-box show-correct';
                    const savedNoteDisplay = localStorage.getItem(`oneword_sub_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (!feedback.innerHTML) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                            <div><strong>Root Word / Etymology Trick:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }
        });

        if (displayCount === 0) {
            let message = 'No One-Word Substitution MCQs matched your search.';
            if (isQidSearch) {
                message = `No question found with QID ${qidNumber}. Please check the QID and try again.`;
            } else if (statusFilter === 'correct' && currentScore === 0) {
                message = 'No correct answers yet. Keep practicing! 🎯';
            } else if (statusFilter === 'wrong' && wrongCount === 0) {
                message = 'No wrong answers yet! Great job! 🎉';
            } else if (statusFilter === 'left') {
                if (answeredCount === activeQuestions.length) {
                    message = '🎉 All questions have been answered! No questions left to attempt.';
                } else {
                    message = `📝 You have ${activeQuestions.length - answeredCount} questions left to attempt. Start answering!`;
                }
            }
            container.innerHTML = `<div class="no-results">${message}</div>`;
        }

        updateStats();
    }

    function checkAnswer(qNum, selectedIdx, correctIdx) {
        if (showAllActive) return;
        if (questionStatus[qNum]) return;
        
        const optsContainer = document.getElementById(`opts-${qNum}`);
        const buttons = optsContainer.querySelectorAll('.opt-btn');
        const feedback = document.getElementById(`feedback-${qNum}`);
        
        if (buttons[0].classList.contains('disabled')) {
            return;
        }
        
        const qObj = activeQuestions.find(item => item.num === qNum);
        qObj._selectedIdx = selectedIdx;
        
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === correctIdx) {
                btn.classList.add('correct');
            }
        });
        
        const savedNote = localStorage.getItem(`oneword_sub_note_QID_${qNum}`) || '';
        const savedNoteHtml = savedNote ? `
            <div class="saved-note-banner" id="saved-display-${qNum}">
                <strong>📌 Saved Note:</strong> ${savedNote}
            </div>` : `<div id="saved-display-${qNum}"></div>`;
        
        const isCorrect = selectedIdx === correctIdx;
        if (isCorrect) {
            currentScore++;
            questionStatus[qNum] = 'correct';
            buttons[selectedIdx].classList.add('correct');
            feedback.className = 'feedback-box show-correct';
            feedback.innerHTML = `
                <div class="feedback-title">✓ Correct Answer!</div>
                <div><strong>Root Word / Etymology Trick:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        } else {
            wrongCount++;
            questionStatus[qNum] = 'wrong';
            buttons[selectedIdx].classList.add('wrong');
            const correctOptText = qObj.options[correctIdx];
            feedback.className = 'feedback-box show-wrong';
            feedback.innerHTML = `
                <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${correctOptText}</div>
                <div><strong>Root Word / Etymology Trick:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        }
        answeredCount++;
        
        const badgeContainer = document.querySelector(`#card-${qNum} .q-badges-left`);
        if (badgeContainer) {
            const oldBadge = badgeContainer.querySelector('.q-status-badge');
            let newBadgeHtml = '';
            if (isCorrect) {
                newBadgeHtml = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else {
                newBadgeHtml = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            }
            if (oldBadge) {
                oldBadge.outerHTML = newBadgeHtml;
            } else {
                badgeContainer.innerHTML += newBadgeHtml;
            }
        }
        
        updateStats();
        
        if (statusFilter !== 'all') {
            renderQuiz();
        }
    }

    function toggleNoteEditor(qNum) {
        const editor = document.getElementById(`editor-${qNum}`);
        if (editor.style.display === 'block') {
            editor.style.display = 'none';
        } else {
            editor.style.display = 'block';
        }
    }

    function saveNote(qNum) {
        const textarea = document.getElementById(`textarea-${qNum}`);
        const noteText = textarea.value.trim();
        const storageKey = `oneword_sub_note_QID_${qNum}`;
        
        if (noteText) {
            localStorage.setItem(storageKey, noteText);
        } else {
            localStorage.removeItem(storageKey);
        }

        const displayContainer = document.getElementById(`saved-display-${qNum}`);
        if (noteText) {
            displayContainer.className = 'saved-note-banner';
            displayContainer.innerHTML = `<strong>📌 Saved Note:</strong> ${noteText}`;
        } else {
            displayContainer.className = '';
            displayContainer.innerHTML = '';
        }
        document.getElementById(`editor-${qNum}`).style.display = 'none';
    }

    function updateStats() {
        const totalQuestions = activeQuestions.length;
        const leftToAttempt = totalQuestions - answeredCount;
        
        document.getElementById('correct-count').textContent = currentScore;
        document.getElementById('wrong-count').textContent = wrongCount;
        document.getElementById('left-count').textContent = leftToAttempt;
        
        const pct = answeredCount > 0 ? Math.round((currentScore / answeredCount) * 100) : 0;
        document.getElementById('pct-display').textContent = pct + '%';
    }

    function filterQuestions(modPrefix) {
        activeFilter = modPrefix;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-filter') === modPrefix) {
                btn.classList.add('active');
            }
        });
        renderQuiz();
    }

    function resetQuiz() {
        if (showAllActive) {
            showAllActive = false;
            const btn = document.getElementById('showAllBtn');
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        questionStatus = {};
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
        renderQuiz();
    }

    function toggleShowAll() {
        const btn = document.getElementById('showAllBtn');
        showAllActive = !showAllActive;
        
        if (showAllActive) {
            btn.classList.add('show-all-active');
            btn.textContent = '🔴 Hide All Answers';
        } else {
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        renderQuiz();
    }

    // Initialize
    initializeAndShuffleQuiz();
    renderQuiz();
</script>
</body>
</html>
