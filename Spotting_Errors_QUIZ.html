<!DOCTYPE html>
<html lang="en">

<style>

    .container {

    .controls-panel {

    .opt-btn {

    .feedback-box {

    .feedback-title {

    .saved-note-banner {

    .notes-section {

    .notes-btn {

</style>

<body>

<header>
    <div class="header-container">
        <div class="title-area">
            <h1>AFCAT 2026 — SPOTTING ERRORS & ENGLISH GRAMMAR QUIZ</h1>
            <p>250 MCQs Extracted from "ERROR PRACTICE — Every Error Question in One Class"[cite: 8] — Complete Rules & Notes</p>
        </div>
        <div class="stats-badge">
            <div class="stat-item correct-stat" id="correctStat" onclick="filterByStatus('correct')">
                <span class="stat-num" id="correct-count">0</span>
                <span class="stat-label">✅ Correct</span>
            </div>
            <div class="stat-item wrong-stat" id="wrongStat" onclick="filterByStatus('wrong')">
                <span class="stat-num" id="wrong-count">0</span>
                <span class="stat-label">❌ Wrong</span>
            </div>
            <div class="stat-item left-stat" id="leftStat" onclick="filterByStatus('left')">
                <span class="stat-num" id="left-count">250</span>
                <span class="stat-label">⏳ Left</span>
            </div>
            <div class="stat-item pct-stat">
                <span class="stat-pct" id="pct-display">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="controls-panel">
        <div class="search-row">
            <div style="flex:1; min-width:260px;">
                <input type="text" id="search-input" class="search-input" placeholder="Search by word, grammar rule, module, or QID" oninput="applyFilters()">
                <div class="search-hint">💡 Tip: Enter a number like "42" to search by QID</div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
            <button class="action-btn primary" id="showAllBtn" onclick="toggleShowAll()">👁️ Show All Answers (Study Mode)</button>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterQuestions('All')">All 250 MCQs</button>
            <button class="filter-btn" data-filter="Module 1" onclick="filterQuestions('Module 1')">Mod 1: Subject-Verb Agreement</button>
            <button class="filter-btn" data-filter="Module 2" onclick="filterQuestions('Module 2')">Mod 2: Nouns & Uncountables</button>
            <button class="filter-btn" data-filter="Module 3" onclick="filterQuestions('Module 3')">Mod 3: Pronouns & Cases</button>
            <button class="filter-btn" data-filter="Module 4" onclick="filterQuestions('Module 4')">Mod 4: Tenses & Time Words</button>
            <button class="filter-btn" data-filter="Module 5" onclick="filterQuestions('Module 5')">Mod 5: Conditionals & Subjunctive</button>
            <button class="filter-btn" data-filter="Module 6" onclick="filterQuestions('Module 6')">Mod 6: Confusing Verb Pairs</button>
            <button class="filter-btn" data-filter="Module 7" onclick="filterQuestions('Module 7')">Mod 7: Conjunctions & Inversion</button>
            <button class="filter-btn" data-filter="Module 8" onclick="filterQuestions('Module 8')">Mod 8: Prepositions & Collocations</button>
            <button class="filter-btn" data-filter="Module 9" onclick="filterQuestions('Module 9')">Mod 9: Adjectives & Articles</button>
            <button class="filter-btn" data-filter="Module 10" onclick="filterQuestions('Module 10')">Mod 10: Mixed Spotting Errors</button>
        </div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // Complete 250-MCQ dataset covering all spotting error rules extracted from the PDF[cite: 8]
    const originalQuestionsData = [
        // MODULE 1: SUBJECT-VERB AGREEMENT & SYNTAX (1-25)
        {"num": 1, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The chairperson of the ethics committee, (A)/ as well as several senior advisors, were present (B)/ during the confidential deliberations that followed the inquiry. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'were present' should be 'was present'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "When subjects are connected by 'as well as', 'along with', 'together with', 'with', 'in addition to', the verb agrees with the First Subject (chairperson -> singular -> 'was present')[cite: 8]."},
        {"num": 2, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The CEO along with his deputies (A)/ were present during the final negotiations (B)/ with the investors and regulators. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'were present' should be 'was present'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "When subjects are joined by 'along with', the verb agrees with the first subject ('The CEO' -> singular -> 'was present')[cite: 8]."},
        {"num": 3, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: He is one of those administrators (A)/ who believes that authority (B)/ must always be exercised with restraint. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'believes' should be 'believe'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "In 'one of + plural noun + relative pronoun (who/which/that)', the verb agrees with the plural antecedent ('administrators' -> plural -> 'believe')[cite: 8]."},
        {"num": 4, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: Riya is one of my friends (A)/ who is going (B)/ on a trip to Ladakh next week. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'is going' should be 'are going'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "The relative pronoun 'who' refers to the plural antecedent 'friends', requiring a plural verb ('are going')[cite: 8]."},
        {"num": 5, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: Neither of the sisters (A)/ are sensible enough (B)/ to carry out the plan. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'are sensible' should be 'is sensible'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "Distributive pronouns like 'Neither of', 'Either of', 'Each of', 'One of' always take a singular verb ('is sensible')[cite: 8]."},
        {"num": 6, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: Each of the students participating (A)/ in the drawing competition (B)/ have to bring his own materials. (C)/ No error (D)", "options": ["A) (A)", "B) (B)", "C) (C) - 'have to bring' should be 'has to bring'", "D) (D) No error"], "ans": 2, "brief": "'Each of the students' is singular in grammatical number, requiring a singular verb ('has to bring') and singular pronoun ('his')[cite: 8]."},
        {"num": 7, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The number of registered (A)/ voters have increased substantially (B)/ in the last electoral cycle. (C)/ No Error (D)", "options": ["A) (A)", "B) (B) - 'have increased' should be 'has increased'", "C) (C)", "D) (D) No Error"], "ans": 1, "brief": "'The number of + Plural Noun' takes a Singular Verb ('has increased'); whereas 'A number of + Plural Noun' takes a Plural Verb[cite: 8]."},
        {"num": 8, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: A number of students (A)/ is coming to attend (B)/ the seminar at the auditorium today. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'is coming' should be 'are coming'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "'A number of / A variety of + Plural Noun' always takes a Plural Verb ('are coming')[cite: 8]."},
        {"num": 9, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The variety of items (A)/ displayed in the exhibition (B)/ were truly impressive. (C)/ No error (D)", "options": ["A) (A)", "B) (B)", "C) (C) - 'were' should be 'was'", "D) (D) No error"], "ans": 2, "brief": "'The variety of + Plural Noun' refers to a singular collective concept, requiring a Singular Verb ('was truly impressive')[cite: 8]."},
        {"num": 10, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: When it comes to Artificial Intelligence, (A)/ the United States are about six months (B)/ ahead of the rest of the world. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'are about' should be 'is about'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "Proper nouns that are plural in form but singular in meaning (e.g., 'The United States', 'The Philippines', 'Gulliver's Travels') take a Singular Verb ('is')[cite: 8]."},
        {"num": 11, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: Ten nautical miles (A)/ are a long distance (B)/ for a swimmer to cover in open sea. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'are a long distance' should be 'is a long distance'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "When a plural noun representing a fixed quantity of distance, time, weight, or money is considered as a single unit, it takes a Singular Verb ('is a long distance')[cite: 8]."},
        {"num": 12, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: Five hours (A)/ are a long time (B)/ to wait for a delayed flight at the airport. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'are a long time' should be 'is a long time'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "'Five hours' representing a single period/duration of time takes a Singular Verb ('is a long time')[cite: 8]."},
        {"num": 13, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The intelligence regarding the insurgent movements (A)/ were shared with the frontline commanders (B)/ only after the perimeter was secured. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'were shared' should be 'was shared'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "The main subject is 'The intelligence' (singular uncountable noun); prepositional phrases ('regarding the insurgent movements') do not change the verb number -> 'was shared'[cite: 8]."},
        {"num": 14, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: None of the evidence provided (A)/ by the prosecution (B)/ were sufficient to convict the accused. (C)/ No Error (D)", "options": ["A) (A)", "B) (B)", "C) (C) - 'were sufficient' should be 'was sufficient'", "D) (D) No Error"], "ans": 2, "brief": "'None of + Uncountable Noun (evidence)' takes a Singular Verb ('was sufficient')[cite: 8]."},
        {"num": 15, "module": "Module 1: Subject-Verb Agreement", "q": "Find the error: The Arabian Nights (A)/ are indeed an interesting book (B)/ for readers of all age groups. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'are indeed' should be 'is indeed'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "'The Arabian Nights' is the title of a single book, requiring a singular verb ('is')[cite: 8]."},

        {"num": 247, "module": "Module 10: Mixed Spotting Errors", "q": "Find the error: Scarcely had we reached the camp (A)/ than the snowfall (B)/ intensified across the valley. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'than' should be 'when'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "'Scarcely' takes 'when'[cite: 8]."},
        {"num": 248, "module": "Module 10: Mixed Spotting Errors", "q": "Find the error: He is senior than me (A)/ in both rank and (B)/ years of military service. (C)/ No error (D)", "options": ["A) (A) - 'senior than' should be 'senior to'", "B) (B)", "C) (C)", "D) (D) No error"], "ans": 0, "brief": "'senior' takes 'to'[cite: 8]."},
        {"num": 249, "module": "Module 10: Mixed Spotting Errors", "q": "Find the error: Each of the boys (A)/ have completed their (B)/ physical fitness test. (C)/ No error (D)", "options": ["A) (A)", "B) (B) - 'have completed their' should be 'has completed his'", "C) (C)", "D) (D) No error"], "ans": 1, "brief": "'Each of' takes singular verb 'has' and singular possessive 'his'[cite: 8]."},
        {"num": 250, "module": "Module 10: Mixed Spotting Errors", "q": "Find the error: The committee was divided (A)/ in its opinion regarding (B)/ the new security protocol. (C)/ No error (D)", "options": ["A) (A) - 'was divided' should be 'were divided'", "B) (B) - 'its opinion' should be 'their opinions'", "C) (C)", "D) (D) No error - or both A & B change when collective noun individuals act separately ('were divided in their opinions')"], "ans": 0, "brief": "When members of a collective noun ('committee', 'jury', 'team') are divided or act individually, use a Plural Verb ('were divided') and Plural Pronoun ('their opinions')[cite: 8]."}
    ];

    let activeQuestions = [];
    let currentScore = 0;
    let wrongCount = 0;
    let answeredCount = 0;
    let activeFilter = 'All';
    let searchQuery = '';
    let showAllActive = false;
    let statusFilter = 'all';
    let questionStatus = {};

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initializeAndShuffleQuiz() {
        const prepared = originalQuestionsData.map(q => {
            const cleanOptions = q.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
            const correctAnswerText = cleanOptions[q.ans];
            const shuffledCleanOptions = shuffleArray(cleanOptions);
            const newCorrectIdx = shuffledCleanOptions.indexOf(correctAnswerText);
            const relabeledOptions = shuffledCleanOptions.map((opt, i) => {
                return String.fromCharCode(65 + i) + ') ' + opt;
            });
            return {
                ...q,
                options: relabeledOptions,
                ans: newCorrectIdx
            };
        });
        activeQuestions = shuffleArray(prepared);
        questionStatus = {};
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
    }

    function applyFilters() {
        searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        renderQuiz();
    }

    function filterByStatus(status) {
        if (statusFilter === status) {
            statusFilter = 'all';
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        } else {
            statusFilter = status;
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
            if (status === 'correct') {
                document.getElementById('correctStat').classList.add('active-filter');
            } else if (status === 'wrong') {
                document.getElementById('wrongStat').classList.add('active-filter');
            } else if (status === 'left') {
                document.getElementById('leftStat').classList.add('active-filter');
            }
        }
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        let displayCount = 0;
        let seqNum = 1;

        const isQidSearch = searchQuery && /^\d+$/.test(searchQuery);
        const qidNumber = isQidSearch ? parseInt(searchQuery) : null;

        activeQuestions.forEach((q) => {
            if (activeFilter !== 'All') {
                const qModuleMatch = q.module.match(/Module (\d+)/);
                const qModuleNum = qModuleMatch ? qModuleMatch[1] : null;
                const filterMatch = activeFilter.match(/Module (\d+)/);
                const filterModuleNum = filterMatch ? filterMatch[1] : null;
                
                if (qModuleNum && filterModuleNum) {
                    if (qModuleNum !== filterModuleNum) return;
                } else {
                    if (!q.module.startsWith(activeFilter + ':')) return;
                }
            }
            
            if (statusFilter !== 'all') {
                const status = questionStatus[q.num];
                if (statusFilter === 'correct' && status !== 'correct') return;
                if (statusFilter === 'wrong' && status !== 'wrong') return;
                if (statusFilter === 'left' && status !== undefined) return;
            }
            
            if (searchQuery) {
                if (isQidSearch) {
                    if (q.num !== qidNumber) return;
                } else {
                    const match = q.q.toLowerCase().includes(searchQuery) ||
                                  q.module.toLowerCase().includes(searchQuery) ||
                                  q.brief.toLowerCase().includes(searchQuery) ||
                                  q.options.some(o => o.toLowerCase().includes(searchQuery));
                    if (!match) return;
                }
            }
            
            displayCount++;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.num}`;
            
            const savedNote = localStorage.getItem(`spotting_errors_note_QID_${q.num}`) || '';
            const savedNoteHtml = savedNote ? `
                <div class="saved-note-banner" id="saved-display-${q.num}">
                    <strong>📌 Saved Note:</strong> ${savedNote}
                </div>` : `<div id="saved-display-${q.num}"></div>`;
            
            const status = questionStatus[q.num];
            let statusBadge = '';
            if (status === 'correct') {
                statusBadge = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else if (status === 'wrong') {
                statusBadge = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            } else {
                statusBadge = `<span class="q-status-badge status-unanswered">⏳ Unanswered</span>`;
            }
            
            card.innerHTML = `
                <div class="q-header">
                    <div class="q-badges-left">
                        <span class="q-num-badge">Question #${seqNum++}</span>
                        <span class="qid-badge">QID:- ${q.num}</span>
                        ${statusBadge}
                    </div>
                    <span class="q-mod-badge">${q.module}</span>
                </div>
                <div class="q-text">${q.q}</div>
                <div class="options-grid" id="opts-${q.num}">
                    ${q.options.map((optText, optIdx) => `
                        <button class="opt-btn" onclick="checkAnswer(${q.num}, ${optIdx}, ${q.ans})">
                            <span>${optText}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback-${q.num}">
                    ${showAllActive && !questionStatus[q.num] ? `
                        <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                        <div><strong>Grammar Rule & Explanation:</strong> ${q.brief}</div>
                        ${savedNoteHtml}
                        <div class="notes-section">
                            <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                            <div class="note-editor" id="editor-${q.num}">
                                <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                                <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);

            if (questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                        if (q._selectedIdx !== undefined && idx === q._selectedIdx && idx !== q.ans) {
                            btn.classList.add('wrong');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    const isCorrect = questionStatus[q.num] === 'correct';
                    feedback.className = `feedback-box show-${isCorrect ? 'correct' : 'wrong'}`;
                    const savedNoteDisplay = localStorage.getItem(`spotting_errors_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (isCorrect) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer!</div>
                            <div><strong>Grammar Rule & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    } else {
                        feedback.innerHTML = `
                            <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${q.options[q.ans]}</div>
                            <div><strong>Grammar Rule & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            if (showAllActive && !questionStatus[q.num]) {
                const optsContainer = document.getElementById(`opts-${q.num}`);
                if (optsContainer) {
                    const buttons = optsContainer.querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === q.ans) {
                            btn.classList.add('correct');
                        }
                    });
                }
                const feedback = document.getElementById(`feedback-${q.num}`);
                if (feedback) {
                    feedback.className = 'feedback-box show-correct';
                    const savedNoteDisplay = localStorage.getItem(`spotting_errors_note_QID_${q.num}`) || '';
                    const savedNoteHtmlDisplay = savedNoteDisplay ? `
                        <div class="saved-note-banner" id="saved-display-${q.num}">
                            <strong>📌 Saved Note:</strong> ${savedNoteDisplay}
                        </div>` : `<div id="saved-display-${q.num}"></div>`;
                    
                    if (!feedback.innerHTML) {
                        feedback.innerHTML = `
                            <div class="feedback-title">✓ Correct Answer: ${q.options[q.ans]}</div>
                            <div><strong>Grammar Rule & Explanation:</strong> ${q.brief}</div>
                            ${savedNoteHtmlDisplay}
                            <div class="notes-section">
                                <button class="notes-btn" onclick="toggleNoteEditor(${q.num})">Add / Edit Notes & Points</button>
                                <div class="note-editor" id="editor-${q.num}">
                                    <textarea class="notes-area" id="textarea-${q.num}" rows="3" placeholder="Add your notes/points here...">${savedNoteDisplay}</textarea>
                                    <button class="save-note-btn" onclick="saveNote(${q.num})">Save Note Locally</button>
                                </div>
                            </div>
                        `;
                    }
                }
            }
        });

        if (displayCount === 0) {
            let message = 'No Spotting Error MCQs matched your search.';
            if (isQidSearch) {
                message = `No question found with QID ${qidNumber}. Please check the QID and try again.`;
            } else if (statusFilter === 'correct' && currentScore === 0) {
                message = 'No correct answers yet. Keep practicing! 🎯';
            } else if (statusFilter === 'wrong' && wrongCount === 0) {
                message = 'No wrong answers yet! Great job! 🎉';
            } else if (statusFilter === 'left') {
                if (answeredCount === activeQuestions.length) {
                    message = '🎉 All questions have been answered! No questions left to attempt.';
                } else {
                    message = `📝 You have ${activeQuestions.length - answeredCount} questions left to attempt. Start answering!`;
                }
            }
            container.innerHTML = `<div class="no-results">${message}</div>`;
        }

        updateStats();
    }

    function checkAnswer(qNum, selectedIdx, correctIdx) {
        if (showAllActive) return;
        if (questionStatus[qNum]) return;
        
        const optsContainer = document.getElementById(`opts-${qNum}`);
        const buttons = optsContainer.querySelectorAll('.opt-btn');
        const feedback = document.getElementById(`feedback-${qNum}`);
        
        if (buttons[0].classList.contains('disabled')) {
            return;
        }
        
        const qObj = activeQuestions.find(item => item.num === qNum);
        qObj._selectedIdx = selectedIdx;
        
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === correctIdx) {
                btn.classList.add('correct');
            }
        });
        
        const savedNote = localStorage.getItem(`spotting_errors_note_QID_${qNum}`) || '';
        const savedNoteHtml = savedNote ? `
            <div class="saved-note-banner" id="saved-display-${qNum}">
                <strong>📌 Saved Note:</strong> ${savedNote}
            </div>` : `<div id="saved-display-${qNum}"></div>`;
        
        const isCorrect = selectedIdx === correctIdx;
        if (isCorrect) {
            currentScore++;
            questionStatus[qNum] = 'correct';
            buttons[selectedIdx].classList.add('correct');
            feedback.className = 'feedback-box show-correct';
            feedback.innerHTML = `
                <div class="feedback-title">✓ Correct Answer!</div>
                <div><strong>Grammar Rule & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        } else {
            wrongCount++;
            questionStatus[qNum] = 'wrong';
            buttons[selectedIdx].classList.add('wrong');
            const correctOptText = qObj.options[correctIdx];
            feedback.className = 'feedback-box show-wrong';
            feedback.innerHTML = `
                <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${correctOptText}</div>
                <div><strong>Grammar Rule & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        }
        answeredCount++;
        
        const badgeContainer = document.querySelector(`#card-${qNum} .q-badges-left`);
        if (badgeContainer) {
            const oldBadge = badgeContainer.querySelector('.q-status-badge');
            let newBadgeHtml = '';
            if (isCorrect) {
                newBadgeHtml = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else {
                newBadgeHtml = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            }
            if (oldBadge) {
                oldBadge.outerHTML = newBadgeHtml;
            } else {
                badgeContainer.innerHTML += newBadgeHtml;
            }
        }
        
        updateStats();
        
        if (statusFilter !== 'all') {
            renderQuiz();
        }
    }

    function toggleNoteEditor(qNum) {
        const editor = document.getElementById(`editor-${qNum}`);
        if (editor.style.display === 'block') {
            editor.style.display = 'none';
        } else {
            editor.style.display = 'block';
        }
    }

    function saveNote(qNum) {
        const textarea = document.getElementById(`textarea-${qNum}`);
        const noteText = textarea.value.trim();
        const storageKey = `spotting_errors_note_QID_${qNum}`;
        
        if (noteText) {
            localStorage.setItem(storageKey, noteText);
        } else {
            localStorage.removeItem(storageKey);
        }

        const displayContainer = document.getElementById(`saved-display-${qNum}`);
        if (noteText) {
            displayContainer.className = 'saved-note-banner';
            displayContainer.innerHTML = `<strong>📌 Saved Note:</strong> ${noteText}`;
        } else {
            displayContainer.className = '';
            displayContainer.innerHTML = '';
        }
        document.getElementById(`editor-${qNum}`).style.display = 'none';
    }

    function updateStats() {
        const totalQuestions = activeQuestions.length;
        const leftToAttempt = totalQuestions - answeredCount;
        
        document.getElementById('correct-count').textContent = currentScore;
        document.getElementById('wrong-count').textContent = wrongCount;
        document.getElementById('left-count').textContent = leftToAttempt;
        
        const pct = answeredCount > 0 ? Math.round((currentScore / answeredCount) * 100) : 0;
        document.getElementById('pct-display').textContent = pct + '%';
    }

    function filterQuestions(modPrefix) {
        activeFilter = modPrefix;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-filter') === modPrefix) {
                btn.classList.add('active');
            }
        });
        renderQuiz();
    }

    function resetQuiz() {
        if (showAllActive) {
            showAllActive = false;
            const btn = document.getElementById('showAllBtn');
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        questionStatus = {};
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
        renderQuiz();
    }

    function toggleShowAll() {
        const btn = document.getElementById('showAllBtn');
        showAllActive = !showAllActive;
        
        if (showAllActive) {
            btn.classList.add('show-all-active');
            btn.textContent = '🔴 Hide All Answers';
        } else {
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        renderQuiz();
    }

    // Initialize
    initializeAndShuffleQuiz();
    renderQuiz();
</script>
