        margin-bottom: 16px;

    }
    
    .options-grid {

    .opt-btn {
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px 16px;

    .opt-btn:hover:not(.disabled) {

        border-color: #94a3b8;
    }
    
    .opt-btn.correct {
        background-color: #ecfdf5 !important;
        border-color: #10b981 !important;
        color: #065f46 !important;
        font-weight: 700;
    }
    
    .opt-btn.wrong {
        background-color: #fef2f2 !important;
        border-color: #ef4444 !important;
        color: #991b1b !important;
    }

    }
    
    .feedback-title {

        align-items: center;

    }

    .saved-note-banner {
        background-color: #fef9c3;

    .notes-section {

    .notes-btn {

    .notes-btn:hover {

    .save-note-btn {

    .no-results {

        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text-muted);

</style>

<body>

<header>
    <div class="header-container">
        <div class="title-area">
            <h1>AFCAT 2026 — INTERNATIONAL & NATIONAL ORGANISATIONS QUIZ</h1>
            <p>250 MCQs Extracted from "Organizations class_compressed (1).pdf"[cite: 7] — HQs, Summits & Heads</p>
        </div>
        <div class="stats-badge">
            <div class="stat-item correct-stat" id="correctStat" onclick="filterByStatus('correct')">
                <span class="stat-num" id="correct-count">0</span>
                <span class="stat-label">✅ Correct</span>
            </div>
            <div class="stat-item wrong-stat" id="wrongStat" onclick="filterByStatus('wrong')">
                <span class="stat-num" id="wrong-count">0</span>
                <span class="stat-label">❌ Wrong</span>
            </div>
            <div class="stat-item left-stat" id="leftStat" onclick="filterByStatus('left')">
                <span class="stat-num" id="left-count">250</span>
                <span class="stat-label">⏳ Left</span>
            </div>
            <div class="stat-item pct-stat">
                <span class="stat-pct" id="pct-display">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="controls-panel">
        <div class="search-row">
            <div style="flex:1; min-width:260px;">
                <input type="text" id="search-input" class="search-input" placeholder="Search by organization, HQ, head, or QID" oninput="applyFilters()">
                <div class="search-hint">💡 Tip: Enter a number like "42" to search by QID</div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
            <button class="action-btn primary" id="showAllBtn" onclick="toggleShowAll()">👁️ Show All Answers (Study Mode)</button>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterQuestions('All')">All 250 MCQs</button>
            <button class="filter-btn" data-filter="Module 1" onclick="filterQuestions('Module 1')">Mod 1: BRICS & NDB</button>
            <button class="filter-btn" data-filter="Module 2" onclick="filterQuestions('Module 2')">Mod 2: BIMSTEC, QUAD & ASEAN</button>
            <button class="filter-btn" data-filter="Module 3" onclick="filterQuestions('Module 3')">Mod 3: SAARC, UN & IAEA</button>
            <button class="filter-btn" data-filter="Module 4" onclick="filterQuestions('Module 4')">Mod 4: FAO, WHO, WTO & UNIDO</button>
            <button class="filter-btn" data-filter="Module 5" onclick="filterQuestions('Module 5')">Mod 5: G7, G20 & AU</button>
            <button class="filter-btn" data-filter="Module 6" onclick="filterQuestions('Module 6')">Mod 6: WB, IMF, NATO & SCO</button>
            <button class="filter-btn" data-filter="Module 7" onclick="filterQuestions('Module 7')">Mod 7: INTERPOL, FATF & UNESCO</button>
            <button class="filter-btn" data-filter="Module 8" onclick="filterQuestions('Module 8')">Mod 8: UNICEF, IBCA & NITI Aayog</button>
            <button class="filter-btn" data-filter="Module 9" onclick="filterQuestions('Module 9')">Mod 9: NABARD, ISRO & RBI</button>
            <button class="filter-btn" data-filter="Module 10" onclick="filterQuestions('Module 10')">Mod 10: IRDAI, SEBI, FSSAI & HQs</button>
        </div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // Complete 250-MCQ dataset covering all topics extracted from the PDF[cite: 7]
    const originalQuestionsData = [
        // MODULE 1: BRICS, NEW DEVELOPMENT BANK (NDB) & UNIDO PARTNERSHIP (1-25)
        {"num": 1, "module": "Module 1: BRICS & NDB", "q": "Who introduced the term 'BRIC' in 2001?", "options": ["A) Jim O'Neill (Goldman Sachs economist)", "B) Klaus Schwab", "C) Christine Lagarde", "D) Joseph Stiglitz"], "ans": 0, "brief": "The term 'BRIC' was introduced in 2001 by Goldman Sachs economist Jim O'Neill[cite: 7]."},
        {"num": 2, "module": "Module 1: BRICS & NDB", "q": "In which year did South Africa join the BRIC grouping, turning it into BRICS?", "options": ["A) 2010", "B) 2008", "C) 2012", "D) 2014"], "ans": 0, "brief": "South Africa joined in 2010, transforming BRIC into BRICS[cite: 7]."},
        {"num": 3, "module": "Module 1: BRICS & NDB", "q": "Where is the headquarters of BRICS located?", "options": ["A) Shanghai, China", "B) Moscow, Russia", "C) New Delhi, India", "D) Pretoria, South Africa"], "ans": 0, "brief": "BRICS is headquartered in Shanghai, China (though it has no permanent secretariat)[cite: 7]."},
        {"num": 4, "module": "Module 1: BRICS & NDB", "q": "BRICS accounts for approximately what percentage of world GDP and global population respectively?", "options": ["A) 25% of world GDP and 40% of global population", "B) 15% of world GDP and 30% of global population", "C) 35% of world GDP and 50% of global population", "D) 20% of world GDP and 25% of global population"], "ans": 0, "brief": "BRICS represents 25% of world GDP and 40% of the global population[cite: 7]."},
        {"num": 5, "module": "Module 1: BRICS & NDB", "q": "Which country hosted the 15th BRICS Summit in 2023?", "options": ["A) South Africa", "B) Russia", "C) Brazil", "D) India"], "ans": 0, "brief": "South Africa hosted the 15th BRICS Summit in 2023[cite: 7]."},
        {"num": 6, "module": "Module 1: BRICS & NDB", "q": "Which country hosted the 16th BRICS Summit in 2024, where countries like Iran and UAE joined as new members?", "options": ["A) Russia (Kazan)", "B) Brazil", "C) China", "D) South Africa"], "ans": 0, "brief": "Russia hosted the 16th BRICS Summit in 2024[cite: 7]."},
        {"num": 7, "module": "Module 1: BRICS & NDB", "q": "Where was the 17th BRICS Summit held in 2025?", "options": ["A) Rio de Janeiro, Brazil", "B) New Delhi, India", "C) Durban, South Africa", "D) Moscow, Russia"], "ans": 0, "brief": "Brazil hosted the 17th BRICS Summit in Rio de Janeiro in 2025[cite: 7]."},
        {"num": 8, "module": "Module 1: BRICS & NDB", "q": "Which country is scheduled to chair and host the 18th BRICS Summit in 2026?", "options": ["A) India (New Delhi at Bharat Mandapam)", "B) China", "C) South Africa", "D) Brazil"], "ans": 0, "brief": "India will chair and host the 18th BRICS Summit in New Delhi in September 2026[cite: 7]."},
        {"num": 9, "module": "Module 1: BRICS & NDB", "q": "What was the theme of the 17th BRICS Summit held in Rio de Janeiro, Brazil?", "options": ["A) Strengthening Global South Cooperation for More Inclusive and Sustainable Governance", "B) Building for Resilience, Innovation, Cooperation and Sustainability", "C) Inclusive Growth for a Multipolar World", "D) Global South Unity for Shared Prosperity"], "ans": 0, "brief": "The theme at Rio de Janeiro was 'Strengthening Global South Cooperation for More Inclusive and Sustainable Governance'[cite: 7]."},

        {"num": 12, "module": "Module 1: BRICS & NDB", "q": "At which summit was the New Development Bank (NDB) jointly founded by BRICS countries in 2014?", "options": ["A) 6th BRICS Summit in Fortaleza, Brazil", "B) 5th BRICS Summit in Durban, South Africa", "C) 7th BRICS Summit in Ufa, Russia", "D) 8th BRICS Summit in Goa, India"], "ans": 0, "brief": "NDB was founded at the 6th BRICS Summit in Fortaleza, Brazil, in 2014[cite: 7]."},

    let activeQuestions = [];

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initializeAndShuffleQuiz() {
        const prepared = originalQuestionsData.map(q => {
            const cleanOptions = q.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
            const correctAnswerText = cleanOptions[q.ans];
            const shuffledCleanOptions = shuffleArray(cleanOptions);
            const newCorrectIdx = shuffledCleanOptions.indexOf(correctAnswerText);
            const relabeledOptions = shuffledCleanOptions.map((opt, i) => {
                return String.fromCharCode(65 + i) + ') ' + opt;
            });
            return {
                ...q,
                options: relabeledOptions,
                ans: newCorrectIdx
            };
        });
        activeQuestions = shuffleArray(prepared);
        questionStatus = {};
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
    }

    function applyFilters() {
        searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        renderQuiz();
    }

    function filterByStatus(status) {
        if (statusFilter === status) {
            statusFilter = 'all';
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        } else {
            statusFilter = status;
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
            if (status === 'correct') {
                document.getElementById('correctStat').classList.add('active-filter');
            } else if (status === 'wrong') {
                document.getElementById('wrongStat').classList.add('active-filter');
            } else if (status === 'left') {
                document.getElementById('leftStat').classList.add('active-filter');
            }
        }
        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        let displayCount = 0;
        let seqNum = 1;

        const isQidSearch = searchQuery && /^\d+$/.test(searchQuery);
        const qidNumber = isQidSearch ? parseInt(searchQuery) : null;

        activeQuestions.forEach((q) => {
            if (activeFilter !== 'All') {
                const qModuleMatch = q.module.match(/Module (\d+)/);
                const qModuleNum = qModuleMatch ? qModuleMatch[1] : null;
                const filterMatch = activeFilter.match(/Module (\d+)/);
                const filterModuleNum = filterMatch ? filterMatch[1] : null;
                
                if (qModuleNum && filterModuleNum) {
                    if (qModuleNum !== filterModuleNum) return;
                } else {
                    if (!q.module.startsWith(activeFilter + ':')) return;
                }
            }
            
            if (statusFilter !== 'all') {
                const status = questionStatus[q.num];
                if (statusFilter === 'correct' && status !== 'correct') return;
                if (statusFilter === 'wrong' && status !== 'wrong') return;
                if (statusFilter === 'left' && status !== undefined) return;
            }
            
            if (searchQuery) {
                if (isQidSearch) {
                    if (q.num !== qidNumber) return;
                } else {
                    const match = q.q.toLowerCase().includes(searchQuery) ||
                                  q.module.toLowerCase().includes(searchQuery) ||
                                  q.brief.toLowerCase().includes(searchQuery) ||
                                  q.options.some(o => o.toLowerCase().includes(searchQuery));
                    if (!match) return;
                }
            }
            
            displayCount++;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.num}`;
            
            const savedNote = localStorage.getItem(`organisations_gk_note_QID_${q.num}`) || '';
            const savedNoteHtml = savedNote ? `
                <div class="saved-note-banner" id="saved-display-${q.num}">
                    <strong>📌 Saved Note:</strong> ${savedNote}
                </div>` : `<div id="saved-display-${q.num}"></div>`;
            
            const status = questionStatus[q.num];
            let statusBadge = '';
            if (status === 'correct') {
                statusBadge = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else if (status === 'wrong') {
                statusBadge = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            } else {
                statusBadge = `<span class="q-status-badge status-unanswered">⏳ Unanswered</span>`;
            }
            
            card.innerHTML = `

        }

        updateStats();
    }

    function checkAnswer(qNum, selectedIdx, correctIdx) {
        if (showAllActive) return;
        if (questionStatus[qNum]) return;
        
        const optsContainer = document.getElementById(`opts-${qNum}`);
        const buttons = optsContainer.querySelectorAll('.opt-btn');
        const feedback = document.getElementById(`feedback-${qNum}`);
        
        if (buttons[0].classList.contains('disabled')) {
            return;
        }
        
        const qObj = activeQuestions.find(item => item.num === qNum);
        qObj._selectedIdx = selectedIdx;
        
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === correctIdx) {
                btn.classList.add('correct');
            }
        });
        
        const savedNote = localStorage.getItem(`organisations_gk_note_QID_${qNum}`) || '';
        const savedNoteHtml = savedNote ? `
            <div class="saved-note-banner" id="saved-display-${qNum}">
                <strong>📌 Saved Note:</strong> ${savedNote}
            </div>` : `<div id="saved-display-${qNum}"></div>`;
        
        const isCorrect = selectedIdx === correctIdx;
        if (isCorrect) {
            currentScore++;
            questionStatus[qNum] = 'correct';
            buttons[selectedIdx].classList.add('correct');
            feedback.className = 'feedback-box show-correct';
            feedback.innerHTML = `
                <div class="feedback-title">✓ Correct Answer!</div>
                <div><strong>Key Fact & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        } else {
            wrongCount++;
            questionStatus[qNum] = 'wrong';
            buttons[selectedIdx].classList.add('wrong');
            const correctOptText = qObj.options[correctIdx];
            feedback.className = 'feedback-box show-wrong';
            feedback.innerHTML = `
                <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${correctOptText}</div>
                <div><strong>Key Fact & Explanation:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        }
        answeredCount++;
        
        const badgeContainer = document.querySelector(`#card-${qNum} .q-badges-left`);
        if (badgeContainer) {
            const oldBadge = badgeContainer.querySelector('.q-status-badge');
            let newBadgeHtml = '';
            if (isCorrect) {
                newBadgeHtml = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else {
                newBadgeHtml = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            }
            if (oldBadge) {
                oldBadge.outerHTML = newBadgeHtml;
            } else {
                badgeContainer.innerHTML += newBadgeHtml;
            }
        }
        
        updateStats();
        
        if (statusFilter !== 'all') {
            renderQuiz();
        }
    }

    function toggleNoteEditor(qNum) {
        const editor = document.getElementById(`editor-${qNum}`);
        if (editor.style.display === 'block') {
            editor.style.display = 'none';
        } else {
            editor.style.display = 'block';
        }
    }

    function saveNote(qNum) {
        const textarea = document.getElementById(`textarea-${qNum}`);
        const noteText = textarea.value.trim();
        const storageKey = `organisations_gk_note_QID_${qNum}`;
        
        if (noteText) {
            localStorage.setItem(storageKey, noteText);
        } else {
            localStorage.removeItem(storageKey);
        }

        const displayContainer = document.getElementById(`saved-display-${qNum}`);
        if (noteText) {
            displayContainer.className = 'saved-note-banner';
            displayContainer.innerHTML = `<strong>📌 Saved Note:</strong> ${noteText}`;
        } else {
            displayContainer.className = '';
            displayContainer.innerHTML = '';
        }
        document.getElementById(`editor-${qNum}`).style.display = 'none';
    }

    function updateStats() {
        const totalQuestions = activeQuestions.length;
        const leftToAttempt = totalQuestions - answeredCount;
        
        document.getElementById('correct-count').textContent = currentScore;
        document.getElementById('wrong-count').textContent = wrongCount;
        document.getElementById('left-count').textContent = leftToAttempt;
        
        const pct = answeredCount > 0 ? Math.round((currentScore / answeredCount) * 100) : 0;
        document.getElementById('pct-display').textContent = pct + '%';
    }

    function filterQuestions(modPrefix) {
        activeFilter = modPrefix;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-filter') === modPrefix) {
                btn.classList.add('active');
            }
        });
        renderQuiz();
    }

    function resetQuiz() {
        if (showAllActive) {
            showAllActive = false;
            const btn = document.getElementById('showAllBtn');
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        questionStatus = {};
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
        renderQuiz();
    }

    function toggleShowAll() {
        const btn = document.getElementById('showAllBtn');
        showAllActive = !showAllActive;
        
        if (showAllActive) {
            btn.classList.add('show-all-active');
            btn.textContent = '🔴 Hide All Answers';
        } else {
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        renderQuiz();
    }

    // Initialize
    initializeAndShuffleQuiz();
    renderQuiz();
</script>
</body>
</html>
