        background: var(--card-bg);
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text-muted);

</style>

<body>

<header>
    <div class="header-container">
        <div class="title-area">
            <h1>AFCAT 2 2026 — CURRENT AFFAIRS & DEFENCE GK QUIZ</h1>
            <p>250 MCQs Extracted from "AFCAT Every Current Affairs 2026 One Shot"[cite: 1] — Interactive Scoring & Notes</p>
        </div>
        <div class="stats-badge">
            <div class="stat-item correct-stat" id="correctStat" onclick="filterByStatus('correct')">
                <span class="stat-num" id="correct-count">0</span>
                <span class="stat-label">✅ Correct</span>
            </div>
            <div class="stat-item wrong-stat" id="wrongStat" onclick="filterByStatus('wrong')">
                <span class="stat-num" id="wrong-count">0</span>
                <span class="stat-label">❌ Wrong</span>
            </div>
            <div class="stat-item left-stat" id="leftStat" onclick="filterByStatus('left')">
                <span class="stat-num" id="left-count">250</span>
                <span class="stat-label">⏳ Left</span>
            </div>
            <div class="stat-item pct-stat">
                <span class="stat-pct" id="pct-display">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="controls-panel">
        <div class="search-row">
            <div style="flex:1; min-width:260px;">
                <input type="text" id="search-input" class="search-input" placeholder="Search by keyword, module, QID" oninput="applyFilters()">
                <div class="search-hint">💡 Tip: Enter a number like "15" to search by QID</div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
            <button class="action-btn primary" id="showAllBtn" onclick="toggleShowAll()">👁️ Show All Answers (Study Mode)</button>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="filterQuestions('All')">All 250 MCQs</button>
            <button class="filter-btn" data-filter="Module 1" onclick="filterQuestions('Module 1')">Mod 1: Defence & Military Ops</button>
            <button class="filter-btn" data-filter="Module 2" onclick="filterQuestions('Module 2')">Mod 2: Indian Navy & Drills</button>

        </div>
    </div>

    <div id="quiz-container"></div>
</div>

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initializeAndShuffleQuiz() {
        const prepared = originalQuestionsData.map(q => {
            const cleanOptions = q.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
            const correctAnswerText = cleanOptions[q.ans];
            const shuffledCleanOptions = shuffleArray(cleanOptions);
            const newCorrectIdx = shuffledCleanOptions.indexOf(correctAnswerText);
            const relabeledOptions = shuffledCleanOptions.map((opt, i) => {
                return String.fromCharCode(65 + i) + ') ' + opt;
            });
            return {
                ...q,
                options: relabeledOptions,
                ans: newCorrectIdx
            };

        if (statusFilter === status) {
            statusFilter = 'all';
            document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        } else {
            statusFilter = status;

                message = 'No correct answers yet. Keep practicing! 🎯';
            } else if (statusFilter === 'wrong' && wrongCount === 0) {
                message = 'No wrong answers yet! Great job! 🎉';
            } else if (statusFilter === 'left') {
                if (answeredCount === activeQuestions.length) {
                    message = '🎉 All questions have been answered! No questions left to attempt.';
                } else {
                    message = `📝 You have ${activeQuestions.length - answeredCount} questions left to attempt. Start answering!`;
                }
            }
            container.innerHTML = `<div class="no-results">${message}</div>`;
        }

        updateStats();
    }

    function checkAnswer(qNum, selectedIdx, correctIdx) {
        if (showAllActive) return;
        if (questionStatus[qNum]) return;
        
        const optsContainer = document.getElementById(`opts-${qNum}`);
        const buttons = optsContainer.querySelectorAll('.opt-btn');
        const feedback = document.getElementById(`feedback-${qNum}`);
        
        if (buttons[0].classList.contains('disabled')) {
            return;
        }
        
        const qObj = activeQuestions.find(item => item.num === qNum);
        qObj._selectedIdx = selectedIdx;
        
        buttons.forEach((btn, idx) => {
            btn.classList.add('disabled');
            if (idx === correctIdx) {
                btn.classList.add('correct');
            }
        });
        
        const savedNote = localStorage.getItem(`defence_gk_note_QID_${qNum}`) || '';
        const savedNoteHtml = savedNote ? `
            <div class="saved-note-banner" id="saved-display-${qNum}">
                <strong>📌 Saved Note:</strong> ${savedNote}
            </div>` : `<div id="saved-display-${qNum}"></div>`;
        
        const isCorrect = selectedIdx === correctIdx;
        if (isCorrect) {
            currentScore++;
            questionStatus[qNum] = 'correct';
            buttons[selectedIdx].classList.add('correct');
            feedback.className = 'feedback-box show-correct';
            feedback.innerHTML = `
                <div class="feedback-title">✓ Correct Answer!</div>
                <div><strong>Why this is right:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        } else {
            wrongCount++;
            questionStatus[qNum] = 'wrong';
            buttons[selectedIdx].classList.add('wrong');
            const correctOptText = qObj.options[correctIdx];
            feedback.className = 'feedback-box show-wrong';
            feedback.innerHTML = `
                <div class="feedback-title">✗ Wrong Answer — The Correct Answer is: ${correctOptText}</div>
                <div><strong>Why this is right:</strong> ${qObj.brief}</div>
                ${savedNoteHtml}
                <div class="notes-section">
                    <button class="notes-btn" onclick="toggleNoteEditor(${qNum})">Add / Edit Notes & Points</button>
                    <div class="note-editor" id="editor-${qNum}">
                        <textarea class="notes-area" id="textarea-${qNum}" rows="3" placeholder="Add your notes/points here...">${savedNote}</textarea>
                        <button class="save-note-btn" onclick="saveNote(${qNum})">Save Note Locally</button>
                    </div>
                </div>
            `;
        }
        answeredCount++;
        
        const badgeContainer = document.querySelector(`#card-${qNum} .q-badges-left`);
        if (badgeContainer) {
            const oldBadge = badgeContainer.querySelector('.q-status-badge');
            let newBadgeHtml = '';
            if (isCorrect) {
                newBadgeHtml = `<span class="q-status-badge status-correct">✅ Correct</span>`;
            } else {
                newBadgeHtml = `<span class="q-status-badge status-wrong">❌ Wrong</span>`;
            }
            if (oldBadge) {
                oldBadge.outerHTML = newBadgeHtml;
            } else {
                badgeContainer.innerHTML += newBadgeHtml;
            }
        }
        
        updateStats();
        
        if (statusFilter !== 'all') {
            renderQuiz();
        }
    }

    function toggleNoteEditor(qNum) {
        const editor = document.getElementById(`editor-${qNum}`);
        if (editor.style.display === 'block') {
            editor.style.display = 'none';
        } else {
            editor.style.display = 'block';
        }
    }

    function saveNote(qNum) {
        const textarea = document.getElementById(`textarea-${qNum}`);
        const noteText = textarea.value.trim();
        const storageKey = `defence_gk_note_QID_${qNum}`;
        
        if (noteText) {
            localStorage.setItem(storageKey, noteText);
        } else {
            localStorage.removeItem(storageKey);
        }

        const displayContainer = document.getElementById(`saved-display-${qNum}`);
        if (noteText) {
            displayContainer.className = 'saved-note-banner';
            displayContainer.innerHTML = `<strong>📌 Saved Note:</strong> ${noteText}`;
        } else {
            displayContainer.className = '';
            displayContainer.innerHTML = '';
        }
        document.getElementById(`editor-${qNum}`).style.display = 'none';
    }

    function updateStats() {
        const totalQuestions = activeQuestions.length;
        const leftToAttempt = totalQuestions - answeredCount;
        
        document.getElementById('correct-count').textContent = currentScore;
        document.getElementById('wrong-count').textContent = wrongCount;
        document.getElementById('left-count').textContent = leftToAttempt;
        
        const pct = answeredCount > 0 ? Math.round((currentScore / answeredCount) * 100) : 0;
        document.getElementById('pct-display').textContent = pct + '%';
    }

    function filterQuestions(modPrefix) {
        activeFilter = modPrefix;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-filter') === modPrefix) {
                btn.classList.add('active');
            }
        });
        renderQuiz();
    }

    function resetQuiz() {
        if (showAllActive) {
            showAllActive = false;
            const btn = document.getElementById('showAllBtn');
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        currentScore = 0;
        wrongCount = 0;
        answeredCount = 0;
        questionStatus = {};
        statusFilter = 'all';
        document.querySelectorAll('.stat-item').forEach(el => el.classList.remove('active-filter'));
        updateStats();
        renderQuiz();
    }

    function toggleShowAll() {
        const btn = document.getElementById('showAllBtn');
        showAllActive = !showAllActive;
        
        if (showAllActive) {
            btn.classList.add('show-all-active');
            btn.textContent = '🔴 Hide All Answers';
        } else {
            btn.classList.remove('show-all-active');
            btn.textContent = '👁️ Show All Answers (Study Mode)';
        }
        renderQuiz();
    }

    // Initialize
    initializeAndShuffleQuiz();
    renderQuiz();
</script>
</body>
</html>
